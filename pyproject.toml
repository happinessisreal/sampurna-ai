[project]
name = "sampurna-ai"
version = "0.1.0"
description = "Sampurna AI — Molecular, Nutritional & Sustainability Formulation Platform for Alternative Proteins (FoodSphere AI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "scipy>=1.14.0",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "anthropic>=0.45.0",
    "openai>=1.58.0",
    "mcp>=1.2.0",
    "python-multipart>=0.0.17",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
