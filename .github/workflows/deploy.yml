name: Test & Auto-Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-sampurna-ai
  cancel-in-progress: true

jobs:
  test:
    name: Backend Tests & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Run pytest suite
        run: uv run pytest -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Type-check & build React frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

  deploy:
    name: Build Image & Deploy to Azure Container Apps
    needs: test
    runs-on: ubuntu-latest
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push multi-stage Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/sampurna-ai:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/sampurna-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Azure Container App (preserves secrets & env vars)
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/sampurna-ai:${{ github.sha }}"

      - name: Verify live HTTPS health endpoint
        run: |
          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          echo "Deployed URL: https://$FQDN"
          for i in $(seq 1 12); do
            if curl -sf "https://$FQDN/api/health"; then
              echo ""
              echo "Health check passed!"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after retries"
          exit 1
